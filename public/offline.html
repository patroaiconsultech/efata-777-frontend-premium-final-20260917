<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#020605" />
    <title>PatroAI offline</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh; margin: 0; display: grid; place-items: center;
        padding: 28px; background:
          radial-gradient(circle at 50% 20%, #1a2e45 0, #0b0f14 45%);
        color: #f5f7fa; text-align: center;
      }
      main { max-width: 520px; }
      .orb {
        width: 92px; height: 92px; margin: 0 auto 24px; border-radius: 50%;
        background: radial-gradient(circle at 38% 35%, #fff4c5, #f6c453 22%, #845a13 72%);
        box-shadow: 0 0 44px #37c5ff70, 0 0 88px #7d6bff40;
      }
      h1 { font-size: clamp(2rem, 8vw, 3.4rem); margin: 0 0 12px; }
      p { color: #c7d2df; line-height: 1.65; }
      button {
        min-height: 48px; margin-top: 18px; border: 1px solid #37c5ff;
        border-radius: 14px; padding: 12px 20px; background: #1a2e45;
        color: white; font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <h1>Você está offline.</h1>
      <p>
        A estrutura pública da PatroAI está disponível, mas dados privados,
        autenticação, mensagens e operações exigem conexão segura.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
