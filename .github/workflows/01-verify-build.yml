name: Verify frontend reproducible build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20.20.2"
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org/"

      - name: Require reviewed lockfile
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f package-lock.json
          test "$(node --version)" = "v20.20.2"
          test "$(npm --version)" = "10.8.2"
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          node scripts/verify-lockfile.mjs

      - name: Verify and build
        shell: bash
        run: bash scripts/verify-and-build.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: orkio-frontend-alpha2-2-build-evidence
          path: |
            build-evidence/
            dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
